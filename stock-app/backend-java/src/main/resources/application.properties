spring.application.name=backend-java

# 伺服器埠：預設 8080 已被 phpMyAdmin 佔用，改 8081
# （Python 版在 8000、這版在 8081，兩後端可同時跑來對照）
server.port=8081

# ---- MySQL 連線（連 Python 版已灌好的 stock_db，不重 seed）----
# 密碼用環境變數 DB_PASSWORD，不寫死進版控（跟 Python 版 .env 同理）。
# 啟動前：export DB_PASSWORD=你的密碼  （開發預設是 stock_pass）
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/stock_db
spring.datasource.username=stock_user
spring.datasource.password=${DB_PASSWORD}

# ---- JSON 輸出 ----
# 讓欄位用 snake_case（stockId → stock_id），和 Python 版 API 回傳格式一致，
# 同一個前端就能無痛對接兩個後端（這正是「同契約、兩實作」的對照重點）
spring.jackson.property-naming-strategy=SNAKE_CASE

# ---- JPA / Hibernate ----
# 資料表由 Python 版建好，Java 只讀、不要自動改結構
spring.jpa.hibernate.ddl-auto=none
# 學習期：印出 Hibernate 產生的 SQL，方便對照理解
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
